apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
    spec:
      containers:
      - name: heart-disease-api
        image: heart-disease-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api-service
spec:
  type: NodePort
  selector:
    app: heart-disease-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000